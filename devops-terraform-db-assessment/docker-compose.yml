services:
  mysql:
    image: mysql:8.0
    container_name: devops-assessment-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: bookings
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "-papppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

